name: inprov
description: INPROV – Native Wellbeing & Mood Tracking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  firebase_analytics: ^11.3.3
  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Local DB
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  # Auth
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  # IAP
  purchases_flutter: ^7.7.1
  # Permissions
  permission_handler: ^11.3.1
  # Calendar
  device_calendar: ^4.3.2
  flutter_local_notifications: ^17.2.3
  # Network
  connectivity_plus: ^6.0.3
  # Navigation
  go_router: ^14.2.7
  # UI
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/moods/
